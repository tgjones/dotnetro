name: CI

on:
  push:
    branches:
      - main
  pull_request:
  
jobs:
  build:
    runs-on: ubuntu-latest
  
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        lfs: true
  
    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0
  
    - name: Build & Test Debug
      run: dotnet test --solution src --configuration Debug

    - name: Build & Test Release
      run: dotnet test --solution src --configuration Release

  # Builds the web playground (src/DotNetro.WebPlayground) as a Pages artifact. Runs on every
  # push and pull request so breakage is caught early; only the deploy job publishes it.
  playground:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        lfs: true

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0

    - name: Install Node
      uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: src/DotNetro.WebPlayground/ClientApp/package-lock.json

    - name: Publish the .NET payload
      run: dotnet publish src/DotNetro.WebPlayground -c Release

    - name: Build the site
      working-directory: src/DotNetro.WebPlayground/ClientApp
      run: |
        npm ci
        npm run build

    - name: Assemble the site
      working-directory: src/DotNetro.WebPlayground/ClientApp/dist
      run: |
        # Pages cannot send the precompressed .br files with a Content-Encoding header, so the
        # worker fetches the .gz files and decompresses them itself; drop the unused .br copies.
        find _framework -name '*.br' -delete
        touch .nojekyll
        cp index.html 404.html

    - name: Upload the site
      uses: actions/upload-pages-artifact@v4
      with:
        path: src/DotNetro.WebPlayground/ClientApp/dist

  # Publishes the playground to GitHub Pages, only from main and only once the build-and-test
  # job and the playground build have both succeeded.
  # Requires Settings > Pages > Source = "GitHub Actions".
  deploy-playground:
    if: github.event_name == 'push'
    needs: [build, playground]
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
